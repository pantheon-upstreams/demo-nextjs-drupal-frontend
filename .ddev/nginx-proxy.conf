# Reverse-proxy the primary DDEV URL to the Next.js dev server (container port 3000).
#
# DDEV regenerates nginx_full/nginx-site.conf on every start (even for generic projects),
# so we keep this config under an unmanaged filename and the post-start hook in
# .ddev/config.yaml copies it into /etc/nginx/sites-enabled/nginx-site.conf and reloads.
# Start the dev server with `ddev develop`.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;

    # Only used for the DDEV healthcheck below.
    root /var/www/html/public;

    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;

    # DDEV healthcheck (/healthcheck, /phpstatus). First so the router considers the
    # project healthy even when the Next.js dev server is not running yet.
    include /etc/nginx/monitoring.conf;

    sendfile off;
    error_log /dev/stdout info;
    access_log /var/log/nginx/access.log;

    # Proxy everything else to the Next.js dev server.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 86400;
        proxy_buffering off;

        # Friendly message when the dev server has not been started yet.
        error_page 502 504 = @nextjs_down;
    }

    location @nextjs_down {
        default_type text/html;
        return 503 '<html><body style="font-family:sans-serif;max-width:40em;margin:4em auto;"><h1>Next.js dev server is not running</h1><p>Start it with <code>ddev develop</code> (or <code>ddev develop --background</code>), then reload.</p><p>The Drupal backend is a separate DDEV project at <a href="https://d11-nextjs-be.ddev.site">https://d11-nextjs-be.ddev.site</a>.</p></body></html>';
    }

    include /etc/nginx/common.d/*.conf;
    include /mnt/ddev_config/nginx/*.conf;
}
